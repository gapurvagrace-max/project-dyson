<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dyson Swarm</title><style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #02030a;
  font-family: Arial, sans-serif;
  color: white;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

#panel {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 10;
  width: 230px;
  padding: 18px;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 16px;
  background: rgba(10,12,25,0.85);
}

h1 {
  margin: 0 0 15px;
  font-size: 21px;
}

.stat {
  margin: 7px 0;
}

button {
  width: 100%;
  margin-top: 12px;
  padding: 11px;
  border: none;
  border-radius: 10px;
  background: white;
  color: black;
  font-size: 14px;
  font-weight: bold;
}

button:active {
  transform: scale(0.97);
}
</style></head><body><canvas id="canvas"></canvas>

<div id="panel">
<h1>☀️ DYSON SWARM</h1><div class="stat">
Collectors: <span id="count">0</span>
</div><div class="stat">
Energy: <span id="energy">0</span> TW
</div><button id="deploy">🚀 Deploy Collector</button>

</div><script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width;
let height;
let centerX;
let centerY;

const collectors = [];
let energy = 0;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  centerX = width / 2;
  centerY = height / 2;
}

window.addEventListener("resize", resize);
resize();

function deployCollector() {
  collectors.push({
    angle: Math.random() * Math.PI * 2,
    radius: 100 + Math.random() * 220,
    speed: 0.002 + Math.random() * 0.004
  });

  energy += 4;

  document.getElementById("count").textContent = collectors.length;
  document.getElementById("energy").textContent = energy;
}

document.getElementById("deploy").addEventListener("click", deployCollector);

function drawBackground() {
  ctx.fillStyle = "#02030a";
  ctx.fillRect(0, 0, width, height);

  for (let i = 0; i < 120; i++) {
    const x = (i * 83) % width;
    const y = (i * 137) % height;

    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.fillRect(x, y, 1, 1);
  }
}

function drawStar() {
  const glow = ctx.createRadialGradient(
    centerX,
    centerY,
    5,
    centerX,
    centerY,
    100
  );

  glow.addColorStop(0, "white");
  glow.addColorStop(0.15, "#fff6a0");
  glow.addColorStop(0.4, "#ffb52e");
  glow.addColorStop(1, "transparent");

  ctx.fillStyle = glow;

  ctx.beginPath();
  ctx.arc(centerX, centerY, 100, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#fff3a6";

  ctx.beginPath();
  ctx.arc(centerX, centerY, 28, 0, Math.PI * 2);
  ctx.fill();
}

function drawOrbit(radius) {
  ctx.strokeStyle = "rgba(255,255,255,0.08)";
  ctx.lineWidth = 1;

  ctx.beginPath();
  ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
  ctx.stroke();
}

function drawCollector(collector) {
  const x = centerX + Math.cos(collector.angle) * collector.radius;
  const y = centerY + Math.sin(collector.angle) * collector.radius;

  ctx.fillStyle = "#66d9ff";

  ctx.beginPath();
  ctx.arc(x, y, 5, 0, Math.PI * 2);
  ctx.fill();
}

function animate() {
  drawBackground();

  drawOrbit(120);
  drawOrbit(200);
  drawOrbit(300);

  drawStar();

  for (const collector of collectors) {
    collector.angle += collector.speed;
    drawCollector(collector);
  }

  requestAnimationFrame(animate);
}

animate();
</script></body>
</html>
